<div class="lp-deck lp-report lp-panel-example" data-demo-report>
  <h3><i class="lp-icon lp-file" aria-hidden="true"></i> Execution report <small data-demo-value="mode">Example</small></h3>
  <div class="lp-report-highlight">
    <div>
      <strong class="lp-rejected"><i class="lp-icon lp-warning" aria-hidden="true"></i> <span data-demo-value="operation">Transfer rejected</span></strong>
      <small data-demo-value="verdict">Test passed</small>
    </div>
    <dl class="lp-demo-balance" aria-label="Example balance comparison">
      <div><dt>Expected</dt><dd data-demo-value="expectedBalance">100</dd></div>
      <div><dt data-demo-value="outputLabel">Sample</dt><dd data-demo-value="actualBalance">100</dd></div>
    </dl>
  </div>
  <div class="lp-report-switch" role="group" aria-label="Example report view" hidden>
    <button type="button" aria-pressed="true" aria-controls="lp-sample-trace">Trace</button>
    <button type="button" aria-pressed="false" aria-controls="lp-sample-state">State</button>
    <button type="button" aria-pressed="false" aria-controls="lp-sample-diff">Diff</button>
  </div>
  <ol id="lp-sample-trace" class="lp-execution-lines">
    <li><b>call</b><code data-demo-value="call">Transfer(100, 150, true)</code></li>
    <li><b>expect</b><code data-demo-value="expectedTrace">rejected · balance 100</code></li>
    <li><b data-demo-value="traceLabel">sample</b><code data-demo-value="actualTrace">rejected · balance 100</code></li>
  </ol>
  <dl id="lp-sample-state" class="lp-scenario-code" hidden>
    <dt>Initial balance</dt><dd>100</dd>
    <dt>Resulting balance</dt><dd data-demo-value="actualBalance">100</dd>
  </dl>
  <dl id="lp-sample-diff" class="lp-scenario-code" hidden>
    <dt>Balance change</dt><dd data-demo-value="balanceChange">0</dd>
    <dt>State changed</dt><dd data-demo-value="actualChanged">No</dd>
  </dl>
</div>
