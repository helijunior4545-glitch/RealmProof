name: RealmProof CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REALMPROOF_CONCURRENCY_DSN: postgresql://ci:ci@localhost:5432/ci
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-not-for-production"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install pinned Gno runtime
        run: |
          git clone --depth 1 --branch v1.8.0 https://github.com/gnolang/gno.git "$RUNNER_TEMP/gno"
          cd "$RUNNER_TEMP/gno"
          go build -o "$RUNNER_TEMP/gno-bin/gno" ./gnovm/cmd/gno
          echo "$RUNNER_TEMP/gno-bin" >> "$GITHUB_PATH"
          echo "GNOROOT=$RUNNER_TEMP/gno" >> "$GITHUB_ENV"
      - name: Build static source parser
        run: go build -o "$RUNNER_TEMP/gno-bin/realmproof-source-parser" tools/sourceparser/main.go
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test -v 2
      - name: Verify PostgreSQL concurrency
        run: python manage.py audit_engines concurrency-v1
      - name: Verify Gno functional and specialized engines
        run: python manage.py audit_engines transfer-v1 ledger-v1 integration-v1 property-v1 fuzz-v1 invariant-v1
      - name: Verify mutation and security engines
        run: python manage.py audit_engines mutation-v1 security-v1
      - name: Verify regression and performance engines
        run: python manage.py audit_engines regression-v1 performance-v1
      - name: Verify production static manifest
        run: DJANGO_DEBUG=0 DJANGO_SECRET_KEY=ci-static-build DATABASE_URL=postgresql://ci:ci@localhost:5432/ci python manage.py collectstatic --noinput

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f docker/Dockerfile -t realmproof:ci .
      - name: Verify packaged runtime and parser
        run: |
          docker run --rm realmproof:ci sh -ec 'test "$(id -u)" = 10001; test -d "$GNOROOT"; gno version; printf "package ledger\nfunc Balance() int { return 0 }\n" | realmproof-source-parser | python -c "import json,sys; x=json.load(sys.stdin); assert x.get(\"package\")==\"ledger\""'
      - name: Smoke test packaged application
        run: |
          docker network create rp-ci
          trap 'docker rm -f rp-web rp-db >/dev/null 2>&1 || true; docker network rm rp-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name rp-db --network rp-ci -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci postgres:16
          for i in $(seq 1 30); do docker exec rp-db pg_isready -U ci -d ci && break; sleep 2; done
          args=(--network rp-ci -e DJANGO_SECRET_KEY=ci-image-only-not-production -e DATABASE_URL=postgresql://ci:ci@rp-db:5432/ci -e DJANGO_ALLOWED_HOSTS=localhost)
          docker run --rm "${args[@]}" realmproof:ci python manage.py migrate --noinput
          docker run --rm "${args[@]}" realmproof:ci python manage.py audit_engines transfer-v1
          docker run -d --name rp-web "${args[@]}" -p 127.0.0.1:18000:8000 realmproof:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18000/studio/health/; then exit 0; fi
            sleep 2
          done
          docker logs rp-web
          exit 1
