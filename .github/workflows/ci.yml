name: RealmProof CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-not-for-production"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test -v 2
      - name: Verify production static manifest
        run: DJANGO_DEBUG=0 DJANGO_SECRET_KEY=ci-static-build DATABASE_URL=postgresql://ci:ci@localhost:5432/ci python manage.py collectstatic --noinput
